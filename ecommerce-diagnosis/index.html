<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>经营诊断助手 · 高保真</title>
<style>
/* ===== 设计令牌：沿用 05-前端原型 v4 色板（中性暖灰 + 主色蓝，警示橙、通过绿克制使用） ===== */
:root{
  --ink:#1A1B1F;--ink2:#3F4148;--sub:#6A6D74;--faint:#9C9A93;
  --line:#E8E6E1;--line-soft:#F1F0EC;--btn-line:#D6D4CE;
  --canvas:#F7F7F5;--paper:#FFFFFF;--head:#FAFAF8;--active:#F1F0EC;--chip:#F1F0EC;
  --link:#2F5BD3;--link-hover:#1F3F99;--link-bg:#E9EEFB;
  --warn:#B23A0E;--warn-bg:#FCEFE9;--warn-line:#F0CDBB;--warn-deep:#7C2D12;
  --ok:#3F8F5F;--ok-bg:#EBF4EE;
  --ai-bg:#F3F5FC;--ai-line:#C9D4EE;--ai-ink:#3D56A6;
  --amber:#8A6116;--amber-bg:#F7EFDC;
  --sh-sm:0 1px 2px rgba(26,27,31,.05);
  --sh-md:0 4px 16px rgba(26,27,31,.09);
  --sh-lg:0 18px 50px rgba(26,27,31,.18);
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--canvas);color:var(--ink);font:13.5px/1.65 -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer;background:none;border:none;padding:0}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--link);outline-offset:2px;border-radius:4px}
::selection{background:#D8E2FA}

/* ===== 演示控制：不属于产品画面 ===== */
.demo-btn{position:fixed;top:9px;right:12px;z-index:30;background:#3F4148;color:#fff;border-radius:999px;padding:3px 13px;font-size:12px;box-shadow:var(--sh-sm)}
.demo-btn:hover{background:#2B2C31}
.demo-panel{position:fixed;top:42px;right:12px;z-index:30;width:306px;max-width:calc(100vw - 24px);max-height:calc(100vh - 64px);overflow:auto;background:#2E2F33;color:#F0F0EE;border-radius:12px;padding:14px 16px;font-size:12px;box-shadow:var(--sh-lg)}
.demo-panel h4{margin:12px 0 5px;font-size:11px;color:#9FA1A7;font-weight:600;letter-spacing:.04em}
.demo-panel label{display:flex;gap:7px;align-items:flex-start;margin:4px 0;cursor:pointer}
.demo-panel select,.demo-panel button{background:#fff;color:#222;border:1px solid #6A6D74;border-radius:6px;padding:1px 9px;font-size:12px}
.demo-panel button:hover{background:#EDEDEB}
.demo-panel .note{color:#8E9096;margin-top:9px;line-height:1.5}

/* ===== 布局：顶部状态栏 + 侧边栏 ===== */
.topbar{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:12px;flex-wrap:wrap;background:rgba(255,255,255,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);padding:9px 20px;font-size:13px;min-height:46px}
.topbar .crumb2{color:var(--sub)}
.topbar .statline{background:var(--warn-bg);color:var(--warn);border:1px solid var(--warn-line);border-radius:999px;padding:1px 11px;font-size:12px;white-space:nowrap;font-variant-numeric:tabular-nums}
.topbar .right{margin-left:auto;display:flex;gap:10px;align-items:center;color:var(--sub);font-size:12px;padding-right:100px;white-space:nowrap}
.topbar .right b{color:var(--ink);font-weight:600}
.layout{display:grid;grid-template-columns:218px minmax(0,1fr);min-height:calc(100vh - 47px)}
nav{padding:18px 12px 20px;border-right:1px solid var(--line);background:var(--paper)}
nav .brand{display:flex;align-items:center;gap:9px;font-weight:700;font-size:14.5px;margin:0 8px 16px;letter-spacing:.01em}
nav .brand .logo{width:24px;height:24px;border-radius:7px;background:linear-gradient(135deg,#3D6BE0,#1F3F99);color:#fff;display:inline-flex;align-items:center;justify-content:center;font-size:12px;font-weight:600;flex:none;box-shadow:var(--sh-sm)}
.mode{display:flex;gap:3px;background:var(--line-soft);border-radius:10px;padding:3px;margin:0 4px 16px}
.mode button{flex:1;text-align:center;border-radius:8px;padding:4.5px 0;color:var(--sub);font-size:12.5px;transition:color .15s}
.mode button:hover{color:var(--ink)}
.mode button[aria-pressed=true]{background:var(--paper);color:var(--ink);font-weight:600;box-shadow:0 1px 3px rgba(26,27,31,.12)}
nav .navitem{display:flex;align-items:center;gap:9px;width:100%;text-align:left;padding:7px 11px;border-radius:8px;margin-bottom:2px;color:var(--ink2);font-size:13px;transition:background .12s}
nav .navitem:hover{background:var(--head)}
nav .navitem[aria-current=page]{background:var(--active);color:var(--ink);font-weight:600}
nav .navitem .nico{width:16px;height:16px;flex:none;opacity:.72}
nav .navitem[aria-current=page] .nico{opacity:1}
nav .dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--warn);margin-left:4px;vertical-align:2px}
main{padding:26px 34px 72px;min-width:0;max-width:1120px}
main.agentbg{max-width:none;background:
  radial-gradient(640px 320px at 50% -40px,#EDF1FB 0%,rgba(237,241,251,0) 70%),
  radial-gradient(500px 300px at 85% 100%,#F4F2EC 0%,rgba(244,242,236,0) 70%)}

/* ===== 文字层级 ===== */
h1{font-size:19px;margin:0;letter-spacing:.01em}
.crumb{color:var(--sub);font-size:12.5px;margin:3px 0 16px}
.muted{color:var(--sub);font-size:12.5px}
.headline{font-size:16.5px;font-weight:650;line-height:1.5;margin:0 0 3px;letter-spacing:.01em}
.subline{color:var(--ink2);font-size:13px}
.amtnum{font-variant-numeric:tabular-nums}

/* ===== 卡片 ===== */
.card{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:16px 18px;margin:0 0 14px;box-shadow:var(--sh-sm)}
.card.alertcard{border-left:3px solid var(--warn)}
.sect{font-size:12px;color:var(--sub);margin-bottom:10px;font-weight:600;letter-spacing:.02em}
.sect .soft{font-weight:normal;color:var(--faint)}

/* ===== 徽标 / 引用 / 按钮 ===== */
.chip{display:inline-block;background:var(--chip);border-radius:999px;padding:1.5px 10px;font-size:11.5px;color:var(--ink2);margin:0 4px 2px 0;white-space:nowrap;font-variant-numeric:tabular-nums}
.chip.ai{background:var(--ai-bg);border:1px dashed var(--ai-line);color:var(--ai-ink)}
.chip.dark,.chip.st-pending{background:var(--ink);color:#fff}
.chip.st-adopted,.chip.st-executing{background:var(--link-bg);color:var(--link)}
.chip.st-review{background:var(--amber-bg);color:var(--amber)}
.chip.st-timeout{background:var(--warn-bg);color:var(--warn)}
.chip.st-rejected,.chip.st-decided,.chip.st-revoked{background:var(--chip);color:var(--sub)}
button.cite{background:var(--paper);border:1px solid var(--line);border-radius:6px;padding:0 6px;font-size:11px;color:var(--link);margin:0 4px 3px 0;transition:border-color .12s}
button.cite:hover{border-color:var(--link);background:var(--link-bg)}
.btn{border:1px solid var(--btn-line);border-radius:8px;padding:4.5px 14px;font-size:13px;background:var(--paper);box-shadow:var(--sh-sm);transition:background .12s,border-color .12s}
.btn:hover{background:var(--head);border-color:var(--faint)}
.btn.pri{background:var(--ink);color:#fff;border-color:var(--ink)}
.btn.pri:hover{background:#000;border-color:#000}
.btn.pri:disabled{background:#C8C7C2;border-color:#C8C7C2;cursor:not-allowed;box-shadow:none}
.btn.sm{padding:1.5px 10px;font-size:12px;border-radius:7px}
.btn[aria-pressed=true]{background:var(--ink);color:#fff;border-color:var(--ink)}
.btn.ghost{background:none;border:none;box-shadow:none;color:var(--sub);text-decoration:underline;text-underline-offset:3px;text-decoration-color:var(--faint);padding:2px 2px}
.btn.ghost:hover{color:var(--ink)}
.actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:12px}
.actions .sep{flex:1}
.num{text-decoration:none;border-bottom:1px dotted var(--faint);font-variant-numeric:tabular-nums;transition:color .12s,border-color .12s}
.num:hover{color:var(--link);border-bottom-color:var(--link)}
.num.neg{color:var(--warn)}
.num.neg:hover{color:var(--warn-deep);border-bottom-color:var(--warn)}

/* ===== 警示条 / 状态行 ===== */
.warnline{border:1px solid var(--warn-line);border-left:3px solid var(--warn);background:var(--warn-bg);color:var(--warn-deep);padding:8px 14px;margin:0 0 12px;font-size:13px;font-weight:600;border-radius:8px}
.warnline.soft{font-weight:normal;color:var(--sub);background:var(--head);border:1px solid var(--line);border-left:3px solid var(--faint)}
.status{margin-top:9px;font-size:13px;padding:8px 13px;background:var(--head);border:1px solid var(--line-soft);border-radius:9px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.status .okmark{color:var(--ok);font-weight:600}

/* ===== 表格 ===== */
table{width:100%;border-collapse:collapse;font-size:13px}
th{color:var(--sub);font-weight:600;font-size:11.5px;text-align:left;padding:5px 8px;border-bottom:1px solid var(--line);letter-spacing:.03em;white-space:nowrap}
td{padding:9px 8px;text-align:left;vertical-align:top;border-bottom:1px solid var(--line-soft)}
tr:last-child td{border-bottom:none}
tbody tr:hover td,tr:hover td{background:var(--head)}
tr:has(th):hover th{background:none}
td.amt,th.amt{text-align:right;font-variant-numeric:tabular-nums}

/* ===== KPI ===== */
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:14px}
.kpi{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:12px 16px 10px;box-shadow:var(--sh-sm)}
.kpi b{display:block;font-size:21px;font-weight:650;letter-spacing:.01em;font-variant-numeric:tabular-nums;margin:1px 0}
.kpi .d{font-size:12px;color:var(--sub)}
.kpi b .num{border-bottom-width:2px}

/* ===== 图表 ===== */
.chart{margin:8px 0 2px}
.chart svg{width:100%;height:auto;display:block}
.chartnote{color:var(--sub);font-size:12px;margin-top:6px}

/* ===== 周报 ② 原因条形 ===== */
.r{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr) 70px;gap:12px;align-items:center;padding:5px 0;font-size:13px}
.r .amt{text-align:right;font-variant-numeric:tabular-nums;font-weight:600}
.bar{height:10px;border-radius:5px;background:#DFA68C;max-width:100%}
.bar.ai{background:var(--ai-bg);border:1px dashed var(--ai-line)}

/* ===== 行动页 ===== */
.action{max-width:760px}
.cause-row{padding:11px 15px;border:1px solid var(--line);border-radius:11px;margin-bottom:9px;background:var(--paper);cursor:pointer;box-shadow:var(--sh-sm);transition:border-color .12s,box-shadow .12s}
.cause-row:hover{border-color:var(--faint)}
.cause-row[aria-current=true]{border-color:var(--link);box-shadow:0 0 0 1px var(--link),var(--sh-md);cursor:default}
.cause-row .hd{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.plan{border-top:1px solid var(--line);margin-top:12px;padding-top:12px}
.plan .pt{font-weight:650;font-size:14px}
.guards{margin-top:6px;font-size:12.5px;line-height:1.8}
.guards .g-ok{color:var(--sub)}
.guards .g-ok .gm{color:var(--ok);font-weight:700}
.guards .g-bad{color:var(--warn);font-weight:600}
input.param{width:86px;font:inherit;border:1px solid var(--btn-line);border-radius:7px;padding:2px 8px;background:var(--paper);text-align:right;font-variant-numeric:tabular-nums}
input.param:hover{border-color:var(--faint)}

/* ===== 悬浮 Agent ===== */
.fab{position:fixed;right:20px;bottom:20px;z-index:28;background:var(--ink);color:#fff;border-radius:999px;padding:8px 18px;font-size:13px;box-shadow:0 8px 24px rgba(26,27,31,.3);transition:transform .12s}
.fab:hover{transform:translateY(-1px)}
.fab b{font-weight:600}
.fab .spark{margin-right:6px;opacity:.85}
.fabpanel{position:fixed;right:20px;bottom:20px;z-index:28;width:352px;max-width:calc(100vw - 28px);height:460px;max-height:calc(100vh - 92px);background:var(--paper);border:1px solid var(--line);border-radius:16px;box-shadow:var(--sh-lg);display:flex;flex-direction:column;overflow:hidden;animation:pop .16s ease-out}
.fabpanel .hd{padding:11px 15px;border-bottom:1px solid var(--line);font-size:12px;color:var(--sub);display:flex;justify-content:space-between;align-items:center;gap:8px;background:var(--head)}
.fabpanel .hd b{color:var(--ink)}
.fabpanel .msgs{flex:1;overflow:auto;padding:12px 15px}
.fabpanel .foot{border-top:1px solid var(--line);padding:9px 11px}
.msg{margin:9px 0;max-width:92%;font-size:13px;line-height:1.6}
.me{margin-left:auto;background:var(--ink);color:#fff;border-radius:12px 12px 3px 12px;padding:6px 12px;width:fit-content}
.bot{background:var(--line-soft);border-radius:12px 12px 12px 3px;padding:8px 12px;width:fit-content}
.bot .num{border-bottom-color:var(--link);color:var(--link)}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:7px}
.inrow{display:flex;gap:8px;align-items:flex-end}
textarea{flex:1;font:inherit;border:1px solid var(--line);background:var(--head);border-radius:9px;padding:7px 11px;resize:none}
textarea:hover{border-color:var(--btn-line)}
.sk{background:linear-gradient(90deg,#ECEBE8 25%,#F4F3F0 50%,#ECEBE8 75%);background-size:200% 100%;animation:shimmer 1.4s infinite;height:13px;border-radius:7px;margin:11px 0}
@keyframes shimmer{to{background-position:-200% 0}}

/* ===== Agent 模式 ===== */
.agwrap{display:flex;flex-direction:column;max-width:680px;margin:0 auto;min-height:calc(100vh - 160px)}
.agwrap .hello{text-align:center;margin:9vh 0 20px}
.agwrap .hello h2{font-size:23px;margin:0 0 8px;letter-spacing:.01em}
.agwrap .hello .muted{max-width:460px;margin:0 auto}
.agmsgs{flex:1;overflow:auto;padding:4px 2px}
.aginput{background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:12px 13px;box-shadow:var(--sh-md);position:sticky;bottom:18px}

/* ===== 周报分段 ===== */
.seg{border-top:1px solid var(--line-soft);padding:10px 0}
.seg:first-of-type{border-top:none}
.seg>button{display:flex;width:100%;justify-content:space-between;text-align:left;gap:10px;align-items:baseline}
.seg>button:hover h3{color:var(--link)}
.seg h3{font-size:13.5px;margin:0;transition:color .12s}
.seg .seg-static h3{font-size:13.5px;margin:0 0 4px}

/* ===== 侧栏 / 弹窗 / 轻提示 ===== */
.sheet{position:fixed;top:0;right:0;bottom:0;width:384px;max-width:92vw;background:var(--paper);border-left:1px solid var(--line);box-shadow:var(--sh-lg);padding:20px;z-index:40;overflow:auto;animation:slidein .18s ease-out}
@keyframes slidein{from{transform:translateX(24px);opacity:0}to{transform:none;opacity:1}}
.sheet dl{display:grid;grid-template-columns:76px 1fr;gap:8px 10px;font-size:13px}
.sheet dt{color:var(--sub)}
.sheet dd{margin:0}
.sheet .bignum{font-size:24px;font-weight:650;margin:10px 0 0;font-variant-numeric:tabular-nums;letter-spacing:.01em}
.mask{position:fixed;inset:0;background:rgba(26,27,31,.4);z-index:50;display:flex;align-items:center;justify-content:center;padding:16px;animation:fadein .14s ease-out}
@keyframes fadein{from{opacity:0}to{opacity:1}}
.modal{background:var(--paper);border-radius:14px;padding:20px;width:440px;max-width:100%;box-shadow:var(--sh-lg);animation:pop .16s ease-out}
@keyframes pop{from{transform:scale(.97);opacity:0}to{transform:none;opacity:1}}
.modal h2{margin:0 0 10px;font-size:15.5px}
.change{background:var(--head);border:1px solid var(--line-soft);border-radius:9px;padding:10px 14px;font-size:13px;margin:10px 0;font-variant-numeric:tabular-nums}
.toast{position:fixed;bottom:26px;left:50%;transform:translateX(-50%);background:#2E2F33;color:#fff;padding:5px 16px;border-radius:999px;z-index:60;font-size:13px;box-shadow:var(--sh-md)}
.anno{display:none;font-size:11px;color:#fff;background:var(--faint);border-radius:4px;padding:0 5px;margin-left:4px;vertical-align:1px}
body.show-anno .anno{display:inline-block}

/* ===== 窄屏（375 宽不横向滚动） ===== */
@media (max-width:860px){
  .layout{grid-template-columns:1fr}
  nav{display:flex;gap:3px;padding:7px 10px;overflow-x:auto;border-right:none;border-bottom:1px solid var(--line);align-items:center}
  nav .brand,nav .grp{display:none}
  .mode{margin:0 6px 0 0;flex:0 0 auto;width:150px}
  .mode button{padding:3.5px 0}
  nav .navitem{width:auto;margin:0;white-space:nowrap;padding:5.5px 10px}
  nav .navitem .nico{display:none}
  main{padding:16px 14px 70px}
  .card{overflow-x:auto}
  .action{grid-template-columns:1fr}
  .kpis{grid-template-columns:repeat(2,minmax(0,1fr))}
  .topbar{padding:8px 12px}
  .topbar .right{padding-right:96px}
  .topbar .statline{display:none}
  .agwrap .hello{margin-top:5vh}
}
</style>
</head>
<body>
<div id="console" aria-label="演示控制（不属于产品画面）"></div>
<div class="topbar" id="topbar"></div>
<div class="layout">
  <nav id="nav" aria-label="导航"></nav>
  <main id="main"></main>
</div>
<div id="fab"></div>
<div id="overlay"></div>

<script>
// 数据全部取自 scenario-data V0.4；剧本没有的用"—"，问题编号放在旁注里。
// 交互与低保真 V0.6.2 完全一致，只升级视觉。
const ROLES={boss:'老板',site:'独立站组',amazon:'Amazon 组',ads:'投放组'};
const GROUP={site:'独立站组',amazon:'Amazon 组',ads:'投放组'};
const A=t=>`<span class="anno">${t}</span>`;

const ICONS={
  daily:'<path d="M1.5 9h3l2-5.5 3 9.5 2-4h3"/>',
  weekly:'<rect x="2" y="3" width="12" height="11" rx="2"/><path d="M2 6.5h12M5.5 1.5v3M10.5 1.5v3"/>',
  action:'<circle cx="8" cy="8" r="6.2"/><circle cx="8" cy="8" r="2.4"/>',
  ledger:'<path d="M3 3.5h10M3 8h10M3 12.5h6.5"/>',
  lib:'<path d="M4 2h8v12l-4-2.6L4 14z"/>',
  sources:'<ellipse cx="8" cy="3.6" rx="5.4" ry="2"/><path d="M2.6 3.6v8.8c0 1.1 2.4 2 5.4 2s5.4-.9 5.4-2V3.6"/><path d="M2.6 8c0 1.1 2.4 2 5.4 2s5.4-.9 5.4-2"/>',
  set:'<circle cx="8" cy="8" r="2.2"/><path d="M8 1.6v2.2M8 12.2v2.2M1.6 8h2.2M12.2 8h2.2M3.5 3.5l1.6 1.6M10.9 10.9l1.6 1.6M12.5 3.5l-1.6 1.6M5.1 10.9l-1.6 1.6"/>',
};
const IC=k=>`<svg class="nico" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICONS[k]}</svg>`;

const SRC={
  week:{v:'$60,680',n:'上周销售额（D-8 到 D-2）',p:'Shopify + Amazon 订单',t:'美国时间上周日到周六',a:'预期 $61,350，比预期 −$670（竞品 −$320 AI 推断、素材疲劳 −$250、正常波动 −$100）；前一周 $61,920（环比 −2.0%）；去年同一周 $52,340（+15.9%）',l:'实测',m:'可能变动（广告类回补）'},
  actual:{v:'$8,080',n:'D-1 实际销售额',p:'Shopify + Amazon 订单',t:'美国时间 D-1',a:'Shopify $6,030 + Amazon $2,050',l:'实测',m:'已成熟'},
  expect:{v:'$9,500',n:'D-1 预期中值',p:'历史订单',t:'去年同星期几（往前 364 天）',a:'$8,050 × 1.18；正常范围 $9,100–9,900（±4.2%）',l:'估算',m:'已成熟'},

function acts(id){const s=STRATS[id],st=S.st[id];if(!st.choice)return s.acts;return (s.altActs&&s.altActs[st.choice])||[];}
function actTo(id,a){if(a.id==='s1a')return `${S.params.qty} 顶 · $${qtyCost().toLocaleString()}`;if(a.id==='s5a')return `$${S.params.price}`;return a.to}
function status(id){
  const st=S.st[id];
  if(['pending','rejected','decided'].includes(st.status))return st.status;
  const a=acts(id).map(x=>st.acts[x.id]||{state:'idle'});
  if(a.length&&a.every(x=>x.state==='revoked'))return 'revoked';
  if(a.some(x=>x.state==='timeout'))return 'timeout';
  if(a.some(x=>x.state==='running'))return 'executing';
  if(a.length&&a.every(x=>x.state==='done'||x.state==='revoked'))return 'review';
  return 'adopted';
}
const TXT={pending:'待决策',adopted:'已采纳',rejected:'不采纳',decided:'已决策',executing:'执行中',timeout:'回读超时',review:'待复盘',revoked:'已撤回'};

// ===== 图表（上色：正常范围带 + 主色实际线；瀑布区分程序估算与 AI 推断） =====
function svgTrend(){
  const days=[['D-8',9520,9005,9795],['D-7',8210,8000,8700],['D-6',8480,8045,8755],['D-5',8370,8095,8805],['D-4',8420,8145,8855],['D-3',8830,8670,9430],['D-2',8850,8810,9590],['D-1',8080,9100,9900]];
  const W=560,H=170,PL=16,PR=70,PT=16,PB=24,ymin=7800,ymax=10000;
  const X=i=>PL+(W-PL-PR)*i/(days.length-1);
  const Y=v=>PT+(H-PT-PB)*(1-(v-ymin)/(ymax-ymin));
  const hi=days.map((d,i)=>`${X(i)},${Y(d[3])}`).join(' ');
  const lo=days.map((d,i)=>`${X(i)},${Y(d[2])}`).reverse().join(' ');
  let g=`<polygon points="${hi} ${lo}" fill="#E9EEFB"/>`;
  g+=`<text x="${X(days.length-1)+10}" y="${Y(9500)}" font-size="10" fill="#8CA0D0">正常范围</text>`;
  g+=`<polyline points="${days.map((d,i)=>`${X(i)},${Y(d[1])}`).join(' ')}" fill="none" stroke="#2F5BD3" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>`;
  const last=days.length-1;
  days.forEach((d,i)=>{
    g+=`<circle cx="${X(i)}" cy="${Y(d[1])}" r="${i===last?4.5:3}" fill="${i===last?'#B23A0E':'#fff'}" stroke="${i===last?'#B23A0E':'#2F5BD3'}" stroke-width="1.6"/>`;
    if(i>=last-2||i===0)g+=`<text x="${X(i)}" y="${Y(d[1])-9}" text-anchor="middle" font-size="10" fill="${i===last?'#B23A0E':'#6A6D74'}" ${i===last?'font-weight="600"':''}>$${d[1].toLocaleString()}</text>`;
    g+=`<text x="${X(i)}" y="${H-4}" text-anchor="middle" font-size="9" fill="#9C9A93">${d[0]}</text>`;
  });
  g+=`<text x="${X(last)+10}" y="${Y(8080)+4}" font-size="11" fill="#B23A0E" font-weight="600">低于下限</text>`;
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="近 8 天日销售额和正常范围">${g}</svg>`;
}
function svgWaterfall(){
  const items=[['预期',9500,'base'],['断货',-600,'est'],['素材疲劳',-300,'est'],['其他',-250,'unk'],['CPC 上涨',-150,'est'],['保温箱',-120,'ai'],['实际',8080,'tot']];
  const W=560,H=190,PL=10,PR=10,PT=18,PB=40,ymin=7800,ymax=9700;
  const Y=v=>PT+(H-PT-PB)*(1-(v-ymin)/(ymax-ymin));
  const n=items.length,step=(W-PL-PR)/n,bw=step*0.52;
  let run=9500,g=`<defs><pattern id="hatch" width="5" height="5" patternTransform="rotate(45)" patternUnits="userSpaceOnUse"><rect width="5" height="5" fill="#F2D9CC"/><line x1="0" y1="0" x2="0" y2="5" stroke="#D99E7E" stroke-width="1.6"/></pattern></defs>`;
  items.forEach((it,i)=>{
    const x=PL+step*i+(step-bw)/2;
    let y0,y1,fill='url(#hatch)',stroke='#C98F6E',dash='',ai=false;
    if(it[2]==='base'){y0=Y(9500);y1=Y(ymin);fill='#1A1B1F';stroke='none'}
    else if(it[2]==='tot'){y0=Y(8080);y1=Y(ymin);fill='#1A1B1F';stroke='none'}
    else{const to=run+it[1];y0=Y(run);y1=Y(to);run=to;
      if(it[2]!=='est'){fill='#FCF4EF';stroke='#C2724C';dash='stroke-dasharray="4 3"';ai=true}}
    g+=`<rect x="${x}" y="${Math.min(y0,y1)}" width="${bw}" height="${Math.abs(y1-y0)}" rx="2.5" fill="${fill}" ${stroke==='none'?'':`stroke="${stroke}"`} ${dash}/>`;
    const lab=it[2]==='base'||it[2]==='tot'?`$${it[1].toLocaleString()}`:`−$${-it[1]}`;
    g+=`<text x="${x+bw/2}" y="${Math.min(y0,y1)-5}" text-anchor="middle" font-size="11" fill="${it[2]==='base'||it[2]==='tot'?'#1A1B1F':'#9A4A22'}" ${it[2]==='base'||it[2]==='tot'?'font-weight="600"':''}>${lab}</text>`;
    g+=`<text x="${x+bw/2}" y="${H-24}" text-anchor="middle" font-size="10" fill="#6A6D74">${it[0]}</text>`;
    if(ai)g+=`<text x="${x+bw/2}" y="${H-10}" text-anchor="middle" font-size="9" fill="#C2724C">${it[2]==='unk'?'待查明':'AI 推断'}</text>`;
    if(i<n-1&&it[2]!=='tot'){const lv=it[2]==='base'?9500:run;g+=`<line x1="${x+bw}" y1="${Y(lv)}" x2="${x+step}" y2="${Y(lv)}" stroke="#D6D4CE"/>`}
  });
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="从预期到实际的瀑布拆解">${g}</svg>`;
}

function actionArea(id,stt,failRev){
  const s=STRATS[id],st=S.st[id];

// ===== 模拟执行 =====
function logLedger(e){S.ledger.unshift(e)}
function run(id,aid,steps,done){
  const as=S.st[id].acts[aid];as.state='running';let i=0;
  const t=()=>{if(i<steps.length){as.step=steps[i++];render();setTimeout(t,800)}else done()};t();
}
function exec(id,aid){
  const a=acts(id).find(x=>x.id===aid),failRev=S.tg.failReview&&id==='s5',tier=tierOf(a,failRev);
  const as=S.st[id].acts[aid]=S.st[id].acts[aid]||{};as.failed=false;
  if(tier==='oneclick'&&S.tg.checkFail){as.state='idle';as.failed=true;render();return}
  const steps=tier==='oneclick'?['核对当前价…','写入…','回读确认…']:['等待平台确认…'];
  run(id,aid,steps,()=>{
    if(S.tg.timeout)as.state='timeout';
    else{as.state='done';as.time=now();as.manual=false;logLedger({t:as.time,label:a.label,chg:`${a.from} → ${actTo(id,a)}`,src:'回读',state:'已确认执行',review:a.review})}
    render();
  });
}
function revoke(id,aid){const a=acts(id).find(x=>x.id===aid);const as=S.st[id].acts[aid];
  run(id,aid,['核对当前价…',`恢复为 ${a.from}…`,'回读确认…'],()=>{as.state='revoked';as.time=now();logLedger({t:as.time,label:a.label,chg:`${actTo(id,a)} → ${a.from}`,src:'回读',state:'已撤回',review:'—'});render()});}

      <div class="change"><div class="muted">${a.plat}</div><div><b>${a.label}</b></div><div>${a.from} → <b>${actTo(id,a)}</b></div>${tier==='task'?'<div class="muted">负责人 '+GROUP[a.group]+' · 截止 —'+A('Q36')+'</div>':''}</div>
      <div class="muted">${tier==='oneclick'?'执行前先核对平台当前值；执行后可撤回。':tier==='backend'?'改完后系统自动回读确认。':'任务生成后，系统回读确认是否已创建。'}</div>
      <div class="actions">${tier==='backend'?'<button class="btn" id="copy">复制修改内容</button>':''}<span class="sep"></span><button class="btn" id="mCancel">取消</button><button class="btn pri" id="goOk">${tier==='oneclick'?'确认执行':tier==='backend'?'打开后台':'生成'}</button></div>`;}
    if(m.type==='adopt2') h+=`<h2>二次确认</h2><div class="change">这次补货成本 <b>$${qtyCost().toLocaleString()}</b>，超过 $10,000。确认采纳吗？</div><div class="actions"><span class="sep"></span><button class="btn" id="mCancel">取消</button><button class="btn pri" id="ad2Ok">确认采纳</button></div>`;
    if(m.type==='reject') h+=`<h2>不采纳的原因</h2>${['不具体','不可行','不认同原因','其他'].map(v=>`<label style="display:block;padding:2px 0"><input type="radio" name="rr" value="${v}"> ${v}</label>`).join('')}<textarea id="rrText" rows="1" style="width:100%;margin-top:8px" placeholder="选"其他"时必填"></textarea><div class="muted" id="rrErr" style="color:var(--warn)"></div><div class="actions"><span class="sep"></span><button class="btn" id="mCancel">取消</button><button class="btn pri" id="rrOk">确定</button></div>`;
    if(m.type==='revoke') h+=`<h2>撤回</h2><div class="change">COOL-01 基础价 $${S.params.price} → <b>$149</b></div><div class="actions"><span class="sep"></span><button class="btn" id="mCancel">取消</button><button class="btn pri" id="rvOk">确认撤回</button></div>`;
    if(m.type==='mark') h+=`<h2>标记已执行</h2><textarea id="mkText" rows="2" style="width:100%" placeholder="实际做了什么（必填）"></textarea><div class="actions"><span class="sep"></span><button class="btn" id="mCancel">取消</button><button class="btn pri" id="mkOk">确定</button></div>`;
    if(m.type==='invalid') h+=`<h2>作废 ${m.id}？</h2><div class="muted">保留记录，不再被引用。</div><div class="actions"><span class="sep"></span><button class="btn" id="mCancel">取消</button><button class="btn pri" id="ivOk">作废</button></div>`;
    h+='</div></div>';
  }
  if(S.toast)h+=`<div class="toast">${S.toast}</div>`;
  $('#overlay').innerHTML=h;
  bindOverlay();
}
function bindOverlay(){
  const on=(s,f)=>{const e=$(s);if(e)e.onclick=f};
  on('#closeSheet',()=>{S.sheet=null;overlay()});
  on('#mCancel',()=>{S.modal=null;overlay()});
  on('#copy',()=>{toast('已复制')});
  on('#goOk',()=>{const [id,aid]=S.modal.key.split('|');S.modal=null;overlay();exec(id,aid)});
  on('#ad2Ok',()=>{S.st[S.modal.id].status='adopted';S.modal=null;render()});
  on('#rrOk',()=>{const v=(document.querySelector('[name=rr]:checked')||{}).value,t=$('#rrText').value.trim();
    if(!v||(v==='其他'&&!t)){$('#rrErr').textContent=!v?'请选一个原因':'请填一句';return}
    const st=S.st[S.modal.id];st.status='rejected';st.reason=v+(t?'：'+esc(t):'');S.modal=null;render()});
  on('#rvOk',()=>{const [id,aid]=S.modal.key.split('|');S.modal=null;overlay();revoke(id,aid)});
  on('#mkOk',()=>{const t=$('#mkText').value.trim();if(!t)return;const [id,aid]=S.modal.key.split('|');const a=acts(id).find(x=>x.id===aid);Object.assign(S.st[id].acts[aid],{state:'done',time:now(),manual:true});logLedger({t:now(),label:a.label,chg:`${a.from} → ${actTo(id,a)}`,src:'手动',state:'已确认执行',review:a.review});S.modal=null;render()});
  on('#ivOk',()=>{S.libInvalid[S.modal.id]=1;S.modal=null;render()});
  document.querySelectorAll('#overlay [data-src]').forEach(e=>e.onclick=()=>{S.sheet=e.dataset.src;overlay()});
}

  if(S.mode==='agent'){$('#main').innerHTML=agentView();fab();overlay();bind();const gm=$('#agmsgs');if(gm)gm.scrollTop=gm.scrollHeight;return}
  $('#main').innerHTML=S.tg.loading&&['daily','action','weekly'].includes(S.view)?`<h1>${{daily:'每日监测',action:'归因与方案',weekly:'周报'}[S.view]}</h1><div class="card"><div class="sk" style="width:35%"></div><div class="sk"></div><div class="sk" style="width:60%"></div></div><div class="card"><div class="sk"></div><div class="sk" style="width:70%"></div></div>`:views[S.view]();
  fab();overlay();bind();
  const am=$('#amsgs');if(am)am.scrollTop=am.scrollHeight;

function bind(){
  const on=(sel,fn)=>document.querySelectorAll('#main '+sel+', #nav '+sel+', #fab '+sel).forEach(e=>e.onclick=ev=>{ev.stopPropagation();fn(e)});
  on('#fabToggle',()=>{S.fabOpen=!S.fabOpen;fab();const am=$('#amsgs');if(am)am.scrollTop=am.scrollHeight;bind()});
  on('[data-mode]',e=>{S.mode=e.dataset.mode;render()});
  on('[data-view]',e=>{S.mode='work';S.view=e.dataset.view;render()});
  on('[data-view-go]',e=>{S.mode='work';S.view=e.dataset.viewGo;render();window.scrollTo({top:0})});
  on('[data-sel-go]',e=>{S.mode='work';S.view='action';S.sel=e.dataset.selGo;render();window.scrollTo({top:0})});
  on('[data-src]',e=>{S.sheet=e.dataset.src;overlay()});
  on('[data-fb]',e=>{S.alertFb=e.dataset.fb;render()});
  on('[data-seg]',e=>{S.seg[e.dataset.seg]=!S.seg[e.dataset.seg];render()});
  on('[data-more]',e=>{S.more[e.dataset.more]=!S.more[e.dataset.more];render()});
  on('[data-alt]',e=>{const [id,k]=e.dataset.alt.split('|');S.st[id].choice=k||null;render()});
  on('[data-adopt]',e=>{const id=e.dataset.adopt;
    if(id==='s1'&&qtyCost()>10000){S.modal={type:'adopt2',id};overlay();return}
    S.st[id].status='adopted';render()});
  on('[data-decide]',e=>{S.st[e.dataset.decide].status='decided';render()});
  on('[data-reject]',e=>{S.modal={type:'reject',id:e.dataset.reject};overlay()});
  on('[data-go]',e=>{S.modal={type:'go',key:e.dataset.go};overlay()});
  on('[data-revoke]',e=>{S.modal={type:'revoke',key:e.dataset.revoke};overlay()});
  on('[data-mark]',e=>{S.modal={type:'mark',key:e.dataset.mark};overlay()});
  on('[data-cfb]',e=>{const [c,v]=e.dataset.cfb.split('|');S.causeFb[c]=v;render()});
  on('[data-lib]',e=>{S.libTab=e.dataset.lib;render()});
  on('[data-invalid]',e=>{S.modal={type:'invalid',id:e.dataset.invalid};overlay()});
  on('.cause-row',e=>{if(S.sel!==e.dataset.sel){S.sel=e.dataset.sel;render()}});
  // 行动页 Agent 栏
  on('[data-aq]',e=>{const [cid,i]=e.dataset.aq.split('|');const c=CAUSES.find(x=>x.id===cid);const x=c.qq[+i];
    S.achat.push({me:1,t:x[0]},{t:x[1]});S.fabOpen=true;render()});
  on('#asend',()=>{const t=$('#aask').value.trim();if(!t)return;
    const sel=CAUSES.find(c=>c.id===S.sel);
    const a=/批准|执行|帮我改|直接/.test(t)?'聊天里说"批准""执行"不生效：请老板在左边 My Plan 上点"采纳"，再由对应组点"执行"。':`演示版先回答左下方的推荐问题（当前归因：${sel?sel.name:'—'}）。`;
    S.achat.push({me:1,t:esc(t)},{t:a});S.fabOpen=true;render()});
  on('#inv',()=>{S.invStep=1;S.fabOpen=true;
    const c=CAUSES.find(x=>x.id==='other');
    S.achat.push({me:1,t:'帮我查一下 Amazon 那 $250 是什么原因'});render();
    let i=0;const t=()=>{if(i<c.traj.length){S.achat.push({t:'第 '+(i+1)+' 步：'+c.traj[i]});i++;S.invStep=Math.min(4,i+0);render();setTimeout(t,800)}else{S.investigated=true;S.invStep=0;S.achat.push({t:'结论：'+c.judge2+'　已在左边生成方案（限时优惠券）。'});render()}};setTimeout(t,700)});
  // Agent 页
  on('[data-gq]',e=>{const x=AGENT_QA[e.dataset.gq];S.agchat.push({me:1,t:x.q},{t:x.a});render()});
  on('#gsend',()=>{const t=$('#gask').value.trim();if(!t)return;
    const a=/批准|执行|帮我改|直接|降到/.test(t)?AGENT_QA.EXE.a:'演示版先回答这些问题：'+Object.values(AGENT_QA).slice(0,3).map(x=>`「${x.q}」`).join('');
    S.agchat.push({me:1,t:esc(t)},{t:a});render()});
  on('#supSend',()=>{S.sup={v:esc($('#supText').value.trim()),t:now()};render()});
  document.querySelectorAll('input.param').forEach(el=>{
    el.onclick=ev=>ev.stopPropagation();
    el.onchange=()=>{const v=parseInt(el.value,10);if(!isFinite(v)||v<0)return;S.params[el.dataset.param]=v;render()};
  });
}
render();
</script>
</body>
</html>
